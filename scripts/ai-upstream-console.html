<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 上游编排台</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --card: #fffdf8;
      --ink: #1c241c;
      --muted: #5c675c;
      --line: #d9d2c5;
      --accent: #1f6b4a;
      --accent-2: #c45c26;
      --danger: #9b2c2c;
      --ok: #1f6b4a;
      --shadow: 0 12px 32px rgba(28, 36, 28, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.5 ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background: radial-gradient(1200px 400px at 10% -10%, #e7f0e4, transparent 50%), var(--bg);
    }
    main { width: min(100% - 1.5rem, 64rem); margin: 0 auto; padding: 1.25rem 0 3rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .35rem; }
    .lead, .hint, label, .log { color: var(--muted); }
    .banner {
      background: #fff3d8; border: 1px solid #e6d2a6; border-radius: 12px;
      padding: .75rem 1rem; margin: 1rem 0 1.25rem;
    }
    .status, .card, .log-wrap {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: var(--shadow); padding: 1rem;
    }
    .status { margin-bottom: 1rem; }
    .grid {
      display: grid; grid-template-columns: 1fr; gap: 1rem; padding: 0;
    }
    @media (min-width: 768px) {
      .grid { grid-template-columns: 1fr 1fr; }
      h1 { font-size: 1.85rem; }
    }
    h2 { margin: 0 0 .75rem; font-size: 1.05rem; }
    label { display: block; font-size: .82rem; margin: .7rem 0 .25rem; }
    input, textarea, select {
      width: 100%; min-height: 44px; border: 1px solid var(--line);
      border-radius: 10px; padding: .65rem .75rem; font: inherit; background: #fff;
    }
    .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: .4rem 0 .2rem; min-height: 2rem; }
    button {
      min-height: 44px; border: 0; border-radius: 999px; padding: .65rem 1rem;
      font: inherit; cursor: pointer;
    }
    .chip { background: #eef5ee; color: var(--ink); }
    .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1rem 0; }
    .primary { background: var(--accent); color: white; }
    .secondary { background: #ece7dc; }
    .checks { display: grid; gap: .45rem; margin: .5rem 0 0; }
    .checks label { display: flex; gap: .5rem; align-items: center; margin: 0; color: var(--ink); }
    .checks input { width: auto; min-height: 0; }
    .log-wrap { margin-top: 1rem; }
    .log {
      white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .85rem; min-height: 10rem; max-height: 22rem; overflow: auto;
      margin: 0; color: var(--ink);
    }
    .ok { color: var(--ok); }
    .bad { color: var(--danger); }
    code { font-family: ui-monospace, Menlo, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>AI 上游编排台</h1>
    <p class="lead">只在本机打开。填 OpenAI 兼容地址和密钥后会自动拉取模型列表。启动命令：<code>pnpm ai:console</code></p>
    <div class="banner">密钥只写入 Cloudflare / GitHub Secret，不会进 Git。本机配置来自 wrangler.jsonc；线上只显示 Worker 是否存活，看不到密钥。</div>
    <section class="status" id="status">正在读取本机配置和线上健康状态…</section>
    <div class="grid">
      <form class="card" id="primary">
        <h2>主上游</h2>
        <div class="chips" data-slot="primary"></div>
        <label>名称</label><input name="name">
        <label>API 地址</label><input name="url" placeholder="https://api.siliconflow.cn/v1">
        <label>模型名（填密钥后点获取模型）</label>
        <select name="modelSelect"><option value="">先获取模型列表</option></select>
        <input name="model" placeholder="也可手动填写模型名">
        <button type="button" class="chip load-models" data-slot="primary">获取模型</button>
        <label>API 密钥（留空表示沿用现有 Secret）</label>
        <input name="key" type="password" autocomplete="off">
      </form>
      <form class="card" id="fallback">
        <h2>备用上游</h2>
        <div class="chips" data-slot="fallback"></div>
        <label>名称</label><input name="name">
        <label>API 地址</label><input name="url" placeholder="https://api.groq.com/openai/v1">
        <label>模型名（填密钥后点获取模型）</label>
        <select name="modelSelect"><option value="">先获取模型列表</option></select>
        <input name="model" placeholder="也可手动填写模型名">
        <button type="button" class="chip load-models" data-slot="fallback">获取模型</button>
        <label>API 密钥（留空表示沿用现有 Secret）</label>
        <input name="key" type="password" autocomplete="off">
      </form>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="probe" checked> 部署前先探测上游是否真能返回内容</label>
      <label><input type="checkbox" id="deploy" checked> 测试通过后部署到线上 Worker</label>
      <label><input type="checkbox" id="syncGithub" checked> 同步 fallback 密钥到 GitHub Secret</label>
      <label><input type="checkbox" id="push"> 只提交并推送 wrangler.jsonc，避免下次 CI 覆盖</label>
    </div>
    <div class="actions">
      <button class="secondary" id="reload" type="button">重新读取本机 / 线上状态</button>
      <button class="secondary" id="probeOnly" type="button">只探测，不部署</button>
      <button class="primary" id="apply" type="button">测试并部署到线上</button>
    </div>
    <section class="log-wrap">
      <h2>日志</h2>
      <pre class="log" id="log">等待操作。</pre>
    </section>
  </main>
  <script>
    const logEl = document.getElementById("log")
    const statusEl = document.getElementById("status")
    let presets = {}

    function log(line) {
      const prefix = logEl.textContent === "等待操作。" ? "" : logEl.textContent + "\n"
      logEl.textContent = prefix + line
      logEl.scrollTop = logEl.scrollHeight
    }

    function formData(id) {
      const form = document.getElementById(id)
      return {
        name: form.name.value.trim(),
        url: form.url.value.trim(),
        model: form.model.value.trim() || form.modelSelect.value.trim(),
        key: form.key.value.trim(),
        preset: form.name.value.trim(),
      }
    }

    async function loadModels(slot, silent) {
      const item = formData(slot)
      if (!item.url || !item.key) {
        if (!silent) log(slot + "：需要 API 地址和密钥才能获取模型")
        return
      }
      log(slot + "：正在获取模型列表…")
      const response = await fetch("/api/models", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: item.url, key: item.key }),
      })
      const result = await response.json()
      const form = document.getElementById(slot)
      const select = form.modelSelect
      select.innerHTML = ""
      const ids = (result.chatModels && result.chatModels.length) ? result.chatModels : (result.models || [])
      if (!ids.length) {
        const empty = document.createElement("option")
        empty.value = ""
        empty.textContent = "没有拉到模型"
        select.appendChild(empty)
        log(slot + " 获取模型失败：" + (result.error || "empty"))
        return
      }
      ids.forEach(function (id) {
        const opt = document.createElement("option")
        opt.value = id
        opt.textContent = id === result.recommended ? id + "（推荐）" : id
        select.appendChild(opt)
      })
      const chosen = result.recommended || ids[0]
      select.value = chosen
      form.model.value = chosen
      log(slot + " 已获取 " + ids.length + " 个可用模型，推荐 " + chosen)
    }

    function fillSlot(id, item) {
      const form = document.getElementById(id)
      if (!item) return
      form.name.value = item.name || ""
      form.url.value = item.url || ""
      form.model.value = item.model || ""
    }

    function applyPreset(slot, key) {
      const preset = presets[key]
      if (!preset) return
      fillSlot(slot, { name: preset.name || key, url: preset.url, model: preset.model })
      log("已填入预设 " + key + " 到 " + slot + "，密钥仍需你自己贴")
    }

    function renderChips() {
      document.querySelectorAll(".chips").forEach(function (node) {
        node.innerHTML = ""
        Object.entries(presets).forEach(function (entry) {
          const key = entry[0]
          const preset = entry[1]
          const button = document.createElement("button")
          button.type = "button"
          button.className = "chip"
          button.textContent = key
          button.title = preset.hint || preset.url
          button.addEventListener("click", function () { applyPreset(node.dataset.slot, key) })
          node.appendChild(button)
        })
      })
    }

    async function loadStatus() {
      statusEl.innerHTML = "正在读取本机 wrangler.jsonc 和线上 Worker health…"
      log("正在读取本机配置和线上 health…")
      const controller = new AbortController()
      const timer = setTimeout(function () { controller.abort() }, 8000)
      try {
        const response = await fetch("/api/status", { signal: controller.signal })
        const data = await response.json()
        presets = data.current.presets || {}
        renderChips()
        fillSlot("primary", data.current.primary)
        fillSlot("fallback", data.current.fallback)
        const live = data.live && data.live.ok
          ? "<span class=\"ok\">线上 health 正常</span> · " + JSON.stringify(data.live.body)
          : "<span class=\"bad\">线上 health 未通</span> · " + ((data.live && (data.live.error || data.live.status)) || "")
        statusEl.innerHTML =
          "<p><strong>本机 wrangler.jsonc</strong>（没点部署前，改这里不会动线上）</p>" +
          "<p>主上游：<code>" + data.current.primary.model + "</code> @ <code>" + data.current.primary.url + "</code></p>" +
          "<p>备用：<code>" + data.current.fallback.model + "</code> @ <code>" + data.current.fallback.url + "</code></p>" +
          "<p><strong>线上 Worker</strong>：" + live + "。只能看到是否存活和上游名字，看不到密钥。</p>"
        log("本机配置已填入表单。线上：" + (data.live && data.live.ok ? "health 正常" : "health 未通"))
      } catch (error) {
        const message = error && error.name === "AbortError" ? "读取超时（本机服务或线上 health 卡住）" : String(error)
        statusEl.innerHTML = "<span class=\"bad\">读取失败：" + message + "</span>"
        log("读取失败：" + message)
      } finally {
        clearTimeout(timer)
      }
    }

    async function probeSelected() {
      logEl.textContent = "开始探测…"
      for (const slot of ["primary", "fallback"]) {
        const item = formData(slot)
        if (!item.url || !item.model || !item.key) {
          log(slot + "：地址/模型/密钥不完整，跳过")
          continue
        }
        const response = await fetch("/api/probe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(item),
        })
        const result = await response.json()
        log(slot + " " + (result.ok ? "OK" : "FAIL") + " HTTP " + result.status + " " + (result.content || result.error || ""))
      }
    }

    async function apply() {
      logEl.textContent = "开始测试并部署…"
      const plan = {
        primary: formData("primary"),
        fallback: formData("fallback"),
        probe: document.getElementById("probe").checked,
        deploy: document.getElementById("deploy").checked,
        syncGithub: document.getElementById("syncGithub").checked,
        push: document.getElementById("push").checked,
      }
      const response = await fetch("/api/apply", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(plan),
      })
      const reader = response.body.getReader()
      const decoder = new TextDecoder()
      let buffer = ""
      const STEP_LABELS = {
        probe: "探测上游", write: "写入本机配置", secret: "写入密钥", test: "本地测试",
        deploy: "部署到线上", live: "线上 health", "live-chat": "线上问答",
        git: "提交 wrangler.jsonc", push: "推送到 GitHub", done: "完成", error: "出错",
      }
      function renderEvent(ev) {
        const label = STEP_LABELS[ev.step] || ev.step
        const slotName = ev.slot === "primary" ? "（主）" : ev.slot === "fallback" ? "（备）" : ""
        const mark = ev.ok === false ? "❌" : ev.ok === true ? "✅" : "⏳"
        let line = mark + " " + label + slotName
        if (ev.message) line += "：" + ev.message
        if (ev.status !== undefined && ev.step !== "done") line += "（HTTP " + ev.status + "）"
        if (ev.content) line += " 返回：" + String(ev.content).slice(0, 80)
        if (ev.error) line += " " + String(ev.error).slice(0, 160)
        if (ev.ok === false && ev.output) line += "\n" + String(ev.output).trim().slice(-800)
        if (ev.step === "done" && ev.status) {
          line += "。线上主上游=" + ((ev.status.primary && (ev.status.primary.model || "未配")) || "未配")
            + "，备用=" + ((ev.status.fallback && (ev.status.fallback.model || "未配")) || "未配")
        }
        return line
      }
      while (true) {
        const chunk = await reader.read()
        if (chunk.done) break
        buffer += decoder.decode(chunk.value, { stream: true })
        const parts = buffer.split("\n\n")
        buffer = parts.pop() || ""
        parts.forEach(function (part) {
          const line = part.split("\n").filter(function (item) { return item.indexOf("data:") === 0 }).map(function (item) { return item.slice(5).trim() }).join("")
          if (!line) return
          try { log(renderEvent(JSON.parse(line))) }
          catch (e) { log(line) }
        })
      }
      log("—— 本次操作结束（若上方出现 ❌，请把最后一段日志发给自己核对，部署可能未生效）——")
      await loadStatus()
    }

    document.querySelectorAll(".load-models").forEach(function (button) {
      button.addEventListener("click", function () {
        loadModels(button.dataset.slot).catch(function (error) { log(String(error)) })
      })
    })
    ;["primary", "fallback"].forEach(function (slot) {
      const form = document.getElementById(slot)
      form.modelSelect.addEventListener("change", function () {
        if (form.modelSelect.value) form.model.value = form.modelSelect.value
      })
      form.key.addEventListener("change", function () {
        loadModels(slot, true).catch(function (error) { log(String(error)) })
      })
      form.url.addEventListener("change", function () {
        loadModels(slot, true).catch(function (error) { log(String(error)) })
      })
    })
    document.getElementById("reload").addEventListener("click", function () {
      loadStatus().catch(function (error) { log(String(error)) })
    })
    document.getElementById("probeOnly").addEventListener("click", function () {
      probeSelected().catch(function (error) { log(String(error)) })
    })
    document.getElementById("apply").addEventListener("click", function () {
      apply().catch(function (error) { log(String(error)) })
    })
    loadStatus()
  </script>
</body>
</html>
