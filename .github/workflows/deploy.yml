name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Build
        env:
          VITE_AI_PROVIDER: ${{ vars.VITE_AI_PROVIDER }}
          VITE_OPENAI_PROXY_URL: ${{ vars.VITE_OPENAI_PROXY_URL }}
          VITE_OPENAI_MODEL: ${{ vars.VITE_OPENAI_MODEL }}
          VITE_SPARK_AUTH_URL: ${{ vars.VITE_SPARK_AUTH_URL }}
        run: |
          case "$VITE_AI_PROVIDER" in
            spark)
              test -n "$VITE_SPARK_AUTH_URL" || { echo "VITE_SPARK_AUTH_URL is required for spark"; exit 1; }
              ;;
            openai)
              test -n "$VITE_OPENAI_PROXY_URL" || { echo "VITE_OPENAI_PROXY_URL is required for openai"; exit 1; }
              ;;
            *)
              echo "VITE_AI_PROVIDER must be spark or openai"
              exit 1
              ;;
          esac
          pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
